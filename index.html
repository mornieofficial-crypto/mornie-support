<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mornie</title>
<meta name="description" content="朝5分の、静かなノートアプリ mornie。">
<style>
:root {
  color-scheme: light dark;
  --bg: #F4F0E7;
  --card: #FCFAF5;
  --ink: #2F2D2A;
  --sub: #6E6963;
  --faint: #9F9891;
  --line: #E3DCCF;
  --accent: #C2765F;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #201E1B;
    --card: #26241F;
    --ink: #ECE7DC;
    --sub: #B4ADA0;
    --faint: #857E71;
    --line: #38352E;
    --accent: #E0977F;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
main {
  max-width: 34rem;
  margin: 0 auto;
  padding: 3.4rem 1.4rem 5rem;
}
a { color: var(--accent); }
.brand {
  font-size: 1.9rem;
  letter-spacing: 0.06em;
  margin: 0 0 0.2rem;
}
.tag { color: var(--sub); margin: 0 0 2.6rem; }
.lead { margin: 0 0 2.6rem; }
.back {
  display: inline-block;
  margin-bottom: 2rem;
  color: var(--sub);
  text-decoration: none;
  font-size: 0.9rem;
}
nav { display: flex; flex-direction: column; gap: 0.6rem; }
a.row {
  display: block;
  padding: 1rem 1.2rem;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--ink);
  text-decoration: none;
}
a.row:hover { border-color: var(--accent); }
a.row b { font-weight: 600; }
a.row span { display: block; color: var(--faint); font-size: 0.85rem; }
h1.title { font-size: 1.5rem; margin: 0 0 0.3rem; }
.updated { color: var(--faint); font-size: 0.85rem; margin: 0 0 2.4rem; }
h2 {
  font-size: 1.05rem;
  margin: 2.6rem 0 0.6rem;
  padding-top: 1.6rem;
  border-top: 1px solid var(--line);
}
h2.lang { font-size: 1.25rem; letter-spacing: 0.04em; }
h3 { font-size: 0.98rem; margin: 1.8rem 0 0.4rem; }
p, li { color: var(--ink); }
ul { padding-left: 1.2rem; }
li { margin: 0.2rem 0; }
code {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0.05rem 0.3rem;
  font-size: 0.9em;
}
footer {
  margin-top: 3.5rem;
  color: var(--faint);
  font-size: 0.8rem;
}
</style>
</head>
<body>
<main>
  <h1 class="brand">mornie</h1>
  <p class="tag">朝、ノートをひらいて今日をつくる。</p>
  <p class="lead">
    mornie は、朝の5分だけの小さなノートアプリです。記録は端末の中だけに保存され、外部には送られません。
  </p>
  <nav>
    <a class="row" href="./privacy.html"><b>プライバシーポリシー</b><span>Privacy Policy（日本語 / English）</span></a>
    <a class="row" href="./support.html"><b>サポート・お問い合わせ</b><span>Support &amp; Contact</span></a>
  </nav>
  <footer>© 2026 mornie</footer>
</main>
</body>
</html>
